<!DOCTYPE html>
<html>
<head>
	<title>LeSiteDeKiki</title>

	<link rel="stylesheet" href="style.css">

</head>

<body>

	<script type="module" src="main.js"></script>

	
	<div class="Tab Container Home" id="Home">
		<span id="JourActuelle">0</span>
		<p></p>
		<span id="Cpt_CigJour">0</span>

		<p class= "IntervalleText">Last :</p>
		<span class="Intervalle" id="IntervalleCig">0</span>

		<p class= "IntervalleText">Best :</p>
		<span class="Intervalle" id="RecordIntervalle">0</span>
		<p> </p>
		<button id="Bp_AddCig">🚬</button> 	

	</div>


	<div class="Tab Container" id="Analyse">
		<h1>Analyse</h1>

			<div id="BpChoixAnalyse">
				<button id="BpChoixAnalyseSem" onclick="showOngletchoixAnalyse('AnalyseSemaine')">Semaine</button>
				<button id="BpChoixAnalyseMois" onclick="showOngletchoixAnalyse('AnalyseMois')">Mois</button>
				<button id="BpChoixAnalyseAnn" onclick="showOngletchoixAnalyse('AnalyseAnnee')">Année</button>
			</div>
	
			<p></p>

			<p></p>

			<span id="VisuGraph"></span>

			<p></p>

			<canvas id="MyChart" width="800" height="500"></canvas>

			<div class="MoyenneNbr">
				<p>Intervalle : </p> 
				<span id="MoyenneJourIntervalle">0</span>
			</div>
			<div class="MoyenneInter">
				<p>Nombre : </p> 
				<span id="MoyenneJourNbrF">0</span>
			</div>
	</div>


	<div class="Tab Container" id="Param">
		<h1>Réglage</h1>

		<button id = "RazTotal">RazTotal</button>

		<p>Objectif Intervalle</p>
		<button id="BpValideParamIntervale">Validation</button>
		<input id="ParamIntervalle" type="time" value="00:00"></input>

		<p>Objectif Nombre</p>
		<button id="BpValideParamNbrSemaine">Validation</button>
		<input id="ParamNbrSemaine" type="real" value="0,0"></input>

	</div>


	<div class="Tab Container" id="Historique">
		<h1>Historique</h1>

		<button id="BpChoixJourMoins">Precedent</button>
		<span id="JourChoixJourVisuTableau" >0</span>
		<button id="BpChoixJourPlus">Suivant</button>
		<p></p>

		<span id="ChoixJourVisuTableau" >0</span>

		<p></p>

		<button id="Bp_AddCig_Historique">Ajouter : 🚬</button> 
		<input id="AjoutLigneManu" type="time" value="00:00"></input>

		<p></p>

		<div class = "tabJourScroll">
		<table id="TabVisuJour"
			<thead>
				<tr>
					<th>#</th>
					<th>Date</th>
					<th>Intervalle</th>
					<th>IntervalleSec</th>
					<th></th>
				</tr>
			</thead>
			<tbody>

			</tbody>
		</table>

		</div>
	</div>



	<div class="BpChoixPage">
		<button onclick="showTab('Home')">🏠</button>
		<button onclick="showTab('Analyse')">📊</button>
		<button onclick="showTab('Historique')">💾</button>
		<button onclick="showTab('Param')">🔧</button>
	</div>


</body>



</html>
